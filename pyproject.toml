[project]
name = "milesight-nvr-2-onvif-proxy"
version = "0.1.0"
description = "Expose each channel of a Milesight NVR as its own ONVIF camera (sub stream + events)"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "jinja2>=3.1.6",
    "pygobject>=3.50",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
